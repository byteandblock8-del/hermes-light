name: Build Hermes Desktop Light

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Hermes
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          fetch-depth: 0

      - name: Read Hermes version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION"

      - name: Build Hermes Desktop Light
        run: |
          python3 scripts/bundles/desktop.py \
            --tag="${{ steps.version.outputs.version }}" \
            --variant=light

      - name: Verify no agent payload
        shell: bash
        run: |
          if [ -e apps/desktop/build/agent-payload ]; then
            echo "ERROR: agent payload exists"
            exit 1
          fi
          echo "PASS: no agent payload"

      - name: Upload GUI-only Mac app
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Desktop-Light-macOS
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
