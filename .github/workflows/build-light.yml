name: Build Hermes Desktop Light

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout current Hermes source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          fetch-depth: 0

      - name: Build Hermes Desktop LIGHT
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"

          python3 scripts/bundles/desktop.py \
            --commit="$SHA" \
            --variant=light

      - name: Verify and inspect finished LIGHT application
        shell: bash
        run: |
          set -euo pipefail

          echo "Produced packages:"
          find apps/desktop/release -maxdepth 1 -type f -print

          ZIP="$(find apps/desktop/release -maxdepth 1 -type f -name '*.zip' | head -1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP produced"
            exit 1
          fi

          rm -rf /tmp/hermes-light-check
          mkdir -p /tmp/hermes-light-check
          ditto -x -k "$ZIP" /tmp/hermes-light-check

          echo "ZIP contents:"
          find /tmp/hermes-light-check -maxdepth 3 -print

          APP="$(find /tmp/hermes-light-check -type d -name '*.app' -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle found inside ZIP"
            exit 1
          fi

          echo "Found application:"
          echo "$APP"

          if find "$APP" -iname '*agent-payload*' -print | grep -q .; then
            echo "ERROR: agent payload detected"
            exit 1
          fi

          echo "PASS: Desktop Light app found with no agent payload."

      - name: Upload Hermes Desktop Light
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Desktop-Light-macOS
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
