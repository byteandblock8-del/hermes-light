name: Build Hermes Desktop Light + Tokyo Themes

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout current Hermes source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          fetch-depth: 0

      - name: Add Tokyo Night and Tokyo Neon Desktop themes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("apps/desktop/src/themes/presets.ts")
          s = p.read_text()

          marker = "export const BUILTIN_THEMES: Record<string, DesktopTheme> = {"

          if marker not in s:
              raise SystemExit("ERROR: Could not find BUILTIN_THEMES in presets.ts")

          themes = r'''
          /** Tokyo Night — deep navy with cool blue accents. */
          export const tokyoNightTheme: DesktopTheme = {
            name: 'tokyo-night',
            label: 'Tokyo Night',
            description: 'Deep blue night theme with cool cyan-blue accents',
            palette: {
              background: { hex: '#1a1b26', alpha: 1 },
              midground: { hex: '#c0caf5', alpha: 1 },
              foreground: { hex: '#c0caf5', alpha: 0 },
              warmGlow: 'rgba(122, 162, 247, 0.05)',
              noiseOpacity: 0,
            },
            typography: {
              fontSans: SYSTEM_SANS,
              fontMono: `"JetBrains Mono", ${SYSTEM_MONO}`,
            },
            terminalBackground: '#16161e',
            colorOverrides: {
              card: '#24283b',
              cardForeground: '#c0caf5',
              popover: '#1f2335',
              popoverForeground: '#c0caf5',
              primary: '#7aa2f7',
              primaryForeground: '#1a1b26',
              secondary: '#2a2f45',
              secondaryForeground: '#c0caf5',
              muted: '#2a2f45',
              mutedForeground: '#9aa5ce',
              accent: '#3b4261',
              accentForeground: '#c0caf5',
              destructive: '#f7768e',
              destructiveForeground: '#1a1b26',
              success: '#9ece6a',
              warning: '#e0af68',
              border: '#3b4261',
              input: '#414868',
              ring: '#7aa2f7',
            },
          }

          /** Tokyo Neon — cyberpunk cyan, violet and magenta on deep navy. */
          export const tokyoNeonTheme: DesktopTheme = {
            name: 'tokyo-neon',
            label: 'Tokyo Neon',
            description: 'Cyberpunk Tokyo with cyan, violet and magenta neon',
            palette: {
              background: { hex: '#0b0f1a', alpha: 1 },
              midground: { hex: '#d7e1ff', alpha: 1 },
              foreground: { hex: '#d7e1ff', alpha: 0 },
              warmGlow: 'rgba(255, 60, 172, 0.06)',
              noiseOpacity: 0,
            },
            typography: {
              fontSans: SYSTEM_SANS,
              fontMono: `"JetBrains Mono", ${SYSTEM_MONO}`,
            },
            terminalBackground: '#080b14',
            colorOverrides: {
              card: '#131d33',
              cardForeground: '#d7e1ff',
              popover: '#10182a',
              popoverForeground: '#e6f7ff',
              primary: '#00e5ff',
              primaryForeground: '#071019',
              secondary: '#7c4dff',
              secondaryForeground: '#ffffff',
              muted: '#17213a',
              mutedForeground: '#7f8ab8',
              accent: '#ff3cac',
              accentForeground: '#ffffff',
              destructive: '#ff4d8d',
              destructiveForeground: '#ffffff',
              success: '#39ff88',
              warning: '#ffd166',
              border: '#26345c',
              input: '#203053',
              ring: '#00e5ff',
            },
          }

          '''

          s = s.replace(marker, themes + "\n" + marker)

          old = """  cyberpunk: cyberpunkTheme
          }"""

          if old not in s:
              raise SystemExit("ERROR: Could not find end of BUILTIN_THEMES map")

          new = """  cyberpunk: cyberpunkTheme,
            'tokyo-night': tokyoNightTheme,
            'tokyo-neon': tokyoNeonTheme,
          }"""

          s = s.replace(old, new)

          p.write_text(s)

          print("Tokyo Night and Tokyo Neon added.")
          PY

      - name: Verify themes were added
        shell: bash
        run: |
          set -euo pipefail

          grep -n "tokyo-night" apps/desktop/src/themes/presets.ts
          grep -n "tokyo-neon" apps/desktop/src/themes/presets.ts

      - name: Commit custom themes for build
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Hermes Light Builder"
          git config user.email "hermes-light-builder@users.noreply.github.com"

          git add apps/desktop/src/themes/presets.ts
          git commit -m "Add Tokyo Night and Tokyo Neon desktop themes"

          echo "Custom build commit:"
          git rev-parse HEAD

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Working tree is not clean after theme commit"
            git status
            exit 1
          fi

          echo "PASS: clean custom-theme checkout"

      - name: Build Hermes Desktop LIGHT
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"

          echo "Building commit:"
          echo "$SHA"

          python3 scripts/bundles/desktop.py \
            --commit="$SHA" \
            --variant=light

      - name: Verify macOS packages were produced
        shell: bash
        run: |
          set -euo pipefail

          echo "Produced files:"
          find apps/desktop/release -maxdepth 1 -type f -print

          DMG="$(find apps/desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          ZIP="$(find apps/desktop/release -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG produced"
            exit 1
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP produced"
            exit 1
          fi

          echo "PASS: DMG and ZIP produced"

      - name: Verify Light build contains no local agent payload
        shell: bash
        run: |
          set -euo pipefail

          if [ -e apps/desktop/build/agent-payload ]; then
            echo "ERROR: agent payload exists"
            exit 1
          fi

          echo "PASS: no agent payload"

      - name: Inspect finished Mac application
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find apps/desktop/release -maxdepth 1 -type f -name '*.zip' -print -quit)"

          rm -rf /tmp/hermes-light-check
          mkdir -p /tmp/hermes-light-check

          ditto -x -k "$ZIP" /tmp/hermes-light-check

          echo "Extracted application files:"
          find /tmp/hermes-light-check -maxdepth 3 -print

          APP="$(find /tmp/hermes-light-check -type d -name '*.app' -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle found inside ZIP"
            exit 1
          fi

          echo "Found application:"
          echo "$APP"

          if find "$APP" -iname '*agent-payload*' -print | grep -q .; then
            echo "ERROR: Finished app contains an agent payload"
            exit 1
          fi

          echo "PASS: finished Light app contains no detected agent payload"

      - name: Upload Hermes Desktop Light with Tokyo themes
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Desktop-Light-Tokyo-macOS
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
