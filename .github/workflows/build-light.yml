name: Build Hermes Light - Tokyo Neon Final Border Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout Hermes
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject Tokyo Neon Desktop theme
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src/themes/presets.ts")
          src = path.read_text()

          registry = "export const BUILTIN_THEMES: Record<string, DesktopTheme> = {"

          if registry not in src:
              raise SystemExit("ERROR: BUILTIN_THEMES registry not found")

          if "export const tokyoNeonTheme" in src:
              raise SystemExit("ERROR: Tokyo Neon already present unexpectedly")

          theme = r'''
          export const tokyoNeonTheme: DesktopTheme = {
            name: 'tokyo-neon',
            label: 'Tokyo Neon',
            description: 'Shibuya cyberpunk — electric cyan, ultraviolet and hot magenta',

            colors: {
              background: '#050812',
              foreground: '#EAF4FF',
              card: '#0B1326',
              cardForeground: '#EAF4FF',
              muted: '#101A31',
              mutedForeground: '#8798C8',
              popover: '#080F20',
              popoverForeground: '#F5F8FF',
              primary: '#00F0FF',
              primaryForeground: '#031014',
              secondary: '#8457FF',
              secondaryForeground: '#FFFFFF',
              accent: '#FF2DAA',
              accentForeground: '#FFFFFF',
              border: '#24436C',
              input: '#132744',
              ring: '#00F0FF',
              midground: '#00F0FF',
              midgroundForeground: '#031014',
              composerRing: '#FF2DAA',
              destructive: '#FF4E78',
              destructiveForeground: '#FFFFFF',
              sidebarBackground: '#060D1B',
              sidebarBorder: '#155375',
              userBubble: '#23113E',
              userBubbleBorder: '#FF2DAA'
            },

            typography: {
              fontSans: SYSTEM_SANS,
              fontMono: `"JetBrains Mono", ${SYSTEM_MONO}`
            },

            terminal: {
              foreground: '#DCEAFF',
              cursor: '#00F0FF',
              selectionBackground: '#00F0FF38',
              black: '#03060C',
              red: '#FF4E78',
              green: '#39FF9A',
              yellow: '#FFD166',
              blue: '#19CFFF',
              magenta: '#FF2DAA',
              cyan: '#00F0FF',
              white: '#CAD8F2',
              brightBlack: '#52658F',
              brightRed: '#FF7B9B',
              brightGreen: '#75FFBA',
              brightYellow: '#FFE39C',
              brightBlue: '#6BE8FF',
              brightMagenta: '#FF7AD6',
              brightCyan: '#8CFAFF',
              brightWhite: '#FFFFFF'
            },

            customCSS: `
              :root[data-hermes-theme="tokyo-neon"] {
                --theme-mix-chrome: 84% !important;
                --theme-mix-sidebar: 88% !important;
                --theme-mix-card: 58% !important;
                --theme-mix-elevated: 68% !important;
                --theme-mix-bubble: 76% !important;

                --theme-fill-primary-accent-mix: 22% !important;
                --theme-fill-secondary-accent-mix: 16% !important;
                --theme-fill-tertiary-accent-mix: 12% !important;

                --theme-stroke-primary-accent-mix: 34% !important;
                --theme-stroke-secondary-accent-mix: 22% !important;

                --theme-row-hover-accent-mix: 15% !important;
                --theme-row-active-accent-mix: 28% !important;
                --theme-control-hover-accent-mix: 14% !important;
                --theme-control-active-accent-mix: 24% !important;

                --ui-cyan: #00F0FF !important;
                --ui-blue: #19CFFF !important;
                --ui-purple: #8457FF !important;
                --ui-red: #FF2DAA !important;
                --ui-green: #39FF9A !important;

                --ui-bg-chrome: rgba(4, 8, 18, 0.90) !important;
                --ui-bg-sidebar: rgba(5, 12, 26, 0.90) !important;
                --ui-bg-editor: rgba(7, 13, 27, 0.82) !important;
                --ui-bg-elevated: rgba(9, 16, 34, 0.88) !important;
                --ui-bg-card: rgba(12, 22, 43, 0.80) !important;
                --ui-bg-input: rgba(5, 14, 30, 0.92) !important;

                --sidebar-edge-border: rgba(0,240,255,0.30) !important;

                --composer-fill:
                  linear-gradient(
                    135deg,
                    rgba(8,18,37,.96),
                    rgba(18,10,43,.95)
                  ) !important;

                --dt-border: #24436C !important;
                --dt-input: #132744 !important;
                --dt-ring: #00F0FF !important;
                --dt-composer-ring: #FF2DAA !important;
                --dt-sidebar-border: rgba(0,240,255,.28) !important;
                --dt-user-bubble-border: #FF2DAA !important;

                --noise-opacity-mul: 0 !important;
              }

              :root[data-hermes-theme="tokyo-neon"],
              :root[data-hermes-theme="tokyo-neon"] body,
              :root[data-hermes-theme="tokyo-neon"] #root {
                background:
                  radial-gradient(
                    ellipse at 8% 4%,
                    rgba(0,240,255,.20) 0%,
                    rgba(0,240,255,.06) 22%,
                    transparent 46%
                  ),
                  radial-gradient(
                    ellipse at 92% 7%,
                    rgba(255,45,170,.20) 0%,
                    rgba(255,45,170,.06) 24%,
                    transparent 48%
                  ),
                  radial-gradient(
                    ellipse at 54% 96%,
                    rgba(132,87,255,.17) 0%,
                    transparent 48%
                  ),
                  linear-gradient(
                    180deg,
                    #050812 0%,
                    #07101D 46%,
                    #04060D 100%
                  ) !important;
              }

              :root[data-hermes-theme="tokyo-neon"] #root {
                position: relative;
                z-index: 1;
              }

              :root[data-hermes-theme="tokyo-neon"] body::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: 9990;
                pointer-events: none;
                background:
                  repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,.016) 0px,
                    rgba(255,255,255,.016) 1px,
                    transparent 1px,
                    transparent 4px
                  ),
                  repeating-linear-gradient(
                    90deg,
                    rgba(0,240,255,.010) 0px,
                    rgba(0,240,255,.010) 1px,
                    transparent 1px,
                    transparent 36px
                  );
                opacity: .32;
                mix-blend-mode: screen;
              }

              :root[data-hermes-theme="tokyo-neon"]
                [data-tour="sessions-sidebar"] {
                background:
                  linear-gradient(
                    180deg,
                    rgba(5,13,29,.94),
                    rgba(3,8,18,.95)
                  ) !important;
                border-right:
                  1px solid rgba(0,240,255,.28) !important;
                box-shadow:
                  8px 0 28px rgba(0,240,255,.07),
                  inset -1px 0 rgba(255,45,170,.08) !important;
                backdrop-filter:
                  blur(20px)
                  saturate(138%);
              }

              /* User wrapper stays invisible. */
              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="aui_user-message-root"] {
                border: 0 !important;
                outline: 0 !important;
                background: transparent !important;
                box-shadow: none !important;
              }

              /* Pink border hugs the actual visible user bubble. */
              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="aui_user-message-root"]
                .composer-human-message {
                border:
                  1px solid rgba(255,45,170,.72) !important;
                background:
                  linear-gradient(
                    135deg,
                    rgba(79,12,82,.74),
                    rgba(36,15,83,.79)
                  ) !important;
                box-shadow:
                  0 0 0 1px rgba(255,45,170,.08),
                  0 0 18px rgba(255,45,170,.14) !important;
              }

              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="aui_user-message-root"]
                .composer-human-message:hover {
                border-color:
                  rgba(255,45,170,.90) !important;
                box-shadow:
                  0 0 0 1px rgba(255,45,170,.12),
                  0 0 22px rgba(255,45,170,.20) !important;
              }

              /* Structural composer root stays invisible. */
              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="composer-root"] {
                border: 0 !important;
                outline: 0 !important;
                background: transparent !important;
                box-shadow: none !important;
              }

              /* Pink border hugs the actual composer surface. */
              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="composer-surface"] {
                border:
                  1px solid rgba(255,45,170,.74) !important;
                background:
                  linear-gradient(
                    135deg,
                    rgba(5,16,34,.96),
                    rgba(22,8,45,.96)
                  ) !important;
                box-shadow:
                  0 0 0 1px rgba(0,240,255,.10),
                  0 0 18px rgba(255,45,170,.20),
                  0 0 34px rgba(0,240,255,.07),
                  0 16px 42px rgba(0,0,0,.36) !important;
                backdrop-filter:
                  blur(19px)
                  saturate(145%);
              }

              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="composer-root"]:focus-within
                [data-slot="composer-surface"] {
                border-color:
                  #FF2DAA !important;
                box-shadow:
                  0 0 0 1px rgba(255,45,170,.72),
                  0 0 22px rgba(255,45,170,.34),
                  0 0 40px rgba(0,240,255,.11),
                  0 18px 46px rgba(0,0,0,.40) !important;
              }

              /* No second cyan rectangle inside composer. */
              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="composer-surface"]
                :is(input, textarea, [contenteditable="true"]) {
                border-color: transparent !important;
                box-shadow: none !important;
                background: transparent !important;
                outline: none !important;
              }

              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="composer-surface"]
                :is(input, textarea, [contenteditable="true"]):focus {
                border-color: transparent !important;
                box-shadow: none !important;
                outline: none !important;
              }

              /* No giant cyan rectangle around assistant response. */
              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="aui_assistant-message-root"],
              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="aui_assistant-message-content"] {
                border: 0 !important;
                outline: 0 !important;
                background: transparent !important;
                box-shadow: none !important;
              }

              /* Thin neon assistant rail. */
              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="aui_assistant-message-content"] {
                position: relative;
              }

              :root[data-hermes-theme="tokyo-neon"]
                [data-slot="aui_assistant-message-content"]::before {
                content: "";
                position: absolute;
                left: -4px;
                top: .45rem;
                bottom: .45rem;
                width: 2px;
                border-radius: 999px;
                background:
                  linear-gradient(
                    180deg,
                    #00F0FF 0%,
                    #8457FF 52%,
                    #FF2DAA 100%
                  );
                box-shadow:
                  0 0 8px rgba(0,240,255,.58),
                  0 0 15px rgba(255,45,170,.18);
                opacity: .78;
              }

              :root[data-hermes-theme="tokyo-neon"]
                :is(
                  [aria-selected="true"],
                  [aria-current="page"],
                  [data-active="true"],
                  [data-state="active"],
                  [data-state="checked"]
                ) {
                border-color:
                  rgba(0,240,255,.48) !important;
                background:
                  linear-gradient(
                    90deg,
                    rgba(0,240,255,.16),
                    rgba(132,87,255,.16) 53%,
                    rgba(255,45,170,.12)
                  ) !important;
                box-shadow:
                  inset 2px 0 #00F0FF,
                  0 0 12px rgba(0,240,255,.12) !important;
              }

              :root[data-hermes-theme="tokyo-neon"]
                :is(
                  [data-slot="card"],
                  [data-slot="code-card"],
                  pre
                ) {
                background:
                  linear-gradient(
                    145deg,
                    rgba(5,14,30,.91),
                    rgba(12,12,38,.88)
                  ) !important;
                border-color:
                  rgba(132,87,255,.28) !important;
                box-shadow:
                  inset 0 0 22px rgba(0,240,255,.018),
                  0 0 14px rgba(132,87,255,.055) !important;
              }

              :root[data-hermes-theme="tokyo-neon"]
                :is(
                  input,
                  textarea,
                  [contenteditable="true"]
                ) {
                background:
                  rgba(4,14,30,.84);
                border-color:
                  rgba(0,240,255,.24);
              }

              :root[data-hermes-theme="tokyo-neon"]
                :is(
                  input,
                  textarea,
                  [contenteditable="true"]
                ):focus {
                border-color:
                  #00F0FF;
                box-shadow:
                  0 0 0 1px rgba(0,240,255,.40),
                  0 0 14px rgba(0,240,255,.16);
              }

              :root[data-hermes-theme="tokyo-neon"]
                :is(
                  [role="dialog"],
                  [role="menu"],
                  [role="listbox"]
                ) {
                background:
                  rgba(7,14,31,.94) !important;
                border:
                  1px solid rgba(0,240,255,.22) !important;
                box-shadow:
                  0 0 0 1px rgba(0,240,255,.04),
                  0 0 24px rgba(0,240,255,.07),
                  0 18px 60px rgba(0,0,0,.46) !important;
                backdrop-filter:
                  blur(22px)
                  saturate(145%);
              }

              :root[data-hermes-theme="tokyo-neon"]
                :is(h1,h2,h3) {
                color: #F4F9FF;
                text-shadow:
                  0 0 9px rgba(0,240,255,.20),
                  0 0 20px rgba(132,87,255,.12);
              }

              :root[data-hermes-theme="tokyo-neon"] a {
                color: #64F6FF !important;
              }

              :root[data-hermes-theme="tokyo-neon"] a:hover {
                color: #FF72D1 !important;
                text-shadow:
                  0 0 9px rgba(255,45,170,.44),
                  0 0 20px rgba(255,45,170,.16);
              }

              :root[data-hermes-theme="tokyo-neon"]
                ::selection {
                background: #00F0FF !important;
                color: #031014 !important;
              }

              :root[data-hermes-theme="tokyo-neon"]
                :focus-visible {
                outline-color: #00F0FF !important;
              }

              :root[data-hermes-theme="tokyo-neon"] * {
                scrollbar-color:
                  #7957E8
                  rgba(4,8,18,.80);
              }

              :root[data-hermes-theme="tokyo-neon"]
                *::-webkit-scrollbar-thumb {
                background:
                  linear-gradient(
                    180deg,
                    #00F0FF 0%,
                    #8457FF 52%,
                    #FF2DAA 100%
                  ) !important;
                border-radius: 999px;
              }

              :root[data-hermes-theme="tokyo-neon"]
                .grain::after {
                display: none !important;
              }
            `
          }

          '''

          src = src.replace(
              registry,
              theme + "\n" + registry,
              1
          )

          old = "cyberpunk: cyberpunkTheme }"

          if old not in src:
              old = "cyberpunk: cyberpunkTheme\n}"

          if old not in src:
              raise SystemExit(
                  "ERROR: Could not locate end of BUILTIN_THEMES"
              )

          replacement = (
              "cyberpunk: cyberpunkTheme,\n"
              "  'tokyo-neon': tokyoNeonTheme\n"
              "}"
          )

          src = src.replace(
              old,
              replacement,
              1
          )

          path.write_text(src)

          print("Tokyo Neon border-aligned theme injected.")
          PY

      - name: Verify theme registration
        shell: bash
        run: |
          set -euo pipefail

          grep -n "export const tokyoNeonTheme" \
            apps/desktop/src/themes/presets.ts

          grep -n "'tokyo-neon': tokyoNeonTheme" \
            apps/desktop/src/themes/presets.ts

      - name: Typecheck Desktop
        shell: bash
        run: |
          set -euo pipefail

          npm --workspace apps/desktop run typecheck

          echo "PASS: Desktop typecheck"

      - name: Build Desktop renderer
        shell: bash
        run: |
          set -euo pipefail

          npm --workspace apps/desktop run build

          echo "PASS: renderer build"

      - name: Commit customized source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Hermes Tokyo Builder"
          git config user.email \
            "hermes-tokyo-builder@users.noreply.github.com"

          git add apps/desktop/src/themes/presets.ts

          git commit \
            -m "Add border-aligned Tokyo Neon Desktop theme"

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: checkout dirty after custom commit"
            git status
            exit 1
          fi

          echo "Custom revision:"
          git rev-parse HEAD

      - name: Build Hermes Desktop LIGHT
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"

          python3 scripts/bundles/desktop.py \
            --commit="$SHA" \
            --variant=light

      - name: Verify Light-only package
        shell: bash
        run: |
          set -euo pipefail

          if [ -e apps/desktop/build/agent-payload ]; then
            echo "ERROR: local agent payload exists"
            exit 1
          fi

          DMG="$(
            find apps/desktop/release \
              -maxdepth 1 \
              -type f \
              -name '*.dmg' \
              -print \
              -quit
          )"

          ZIP="$(
            find apps/desktop/release \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -print \
              -quit
          )"

          test -n "$DMG"
          test -n "$ZIP"

          echo "PASS: Light-only build"
          echo "$DMG"
          echo "$ZIP"

      - name: Upload fixed Tokyo Neon build
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Light-Tokyo-Neon-BORDER-FIX
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
